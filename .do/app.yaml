# DigitalOcean App Platform spec.
# Before go-live, set domains in the control panel (or add a `domains:` block).
# cluster_name must match the existing Managed PostgreSQL cluster.
#
# Secrets (SPOTIFY_CLIENT_SECRET, SESSION_SECRET, etc.) are substituted by
# digitalocean/app_action from GitHub Actions env at deploy time.
# Bindable vars with dots (${db.DATABASE_URL}, ${APP_URL}) are preserved.
# Source uses public git clone URL (DO GitHub OAuth not required).

name: music-release-artists
region: fra

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: backend
    - match:
        path:
          prefix: /
      component:
        name: frontend

databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: film-randomized-db
    db_name: music
    db_user: mra_app

services:
  - name: backend
    git:
      repo_clone_url: https://github.com/RubenPari/music-release-artists.git
      branch: main
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 4000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health/live
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 6
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "4000"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_SSL_CA
        scope: RUN_TIME
        type: SECRET
        value: "${DATABASE_SSL_CA}"
      - key: DATABASE_POOL_MAX
        scope: RUN_TIME
        value: "8"
      - key: SPOTIFY_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: "${SPOTIFY_CLIENT_ID}"
      - key: SPOTIFY_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "${SPOTIFY_CLIENT_SECRET}"
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "${SESSION_SECRET}"
      - key: TOKEN_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: "${TOKEN_ENCRYPTION_KEY}"
      - key: APP_BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}/api
      - key: FRONTEND_ORIGIN
        scope: RUN_TIME
        value: ${APP_URL}
      - key: EMAIL_ENABLED
        scope: RUN_TIME
        value: "${EMAIL_ENABLED}"
      - key: BREVO_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "${BREVO_API_KEY}"
      - key: BREVO_SENDER_EMAIL
        scope: RUN_TIME
        value: "${BREVO_SENDER_EMAIL}"
      - key: BREVO_SENDER_NAME
        scope: RUN_TIME
        value: "${BREVO_SENDER_NAME}"
      - key: RELEASE_WINDOW_DAYS
        scope: RUN_TIME
        value: "90"

  - name: frontend
    git:
      repo_clone_url: https://github.com/RubenPari/music-release-artists.git
      branch: main
    source_dir: frontend
    dockerfile_path: frontend/Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 6

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    git:
      repo_clone_url: https://github.com/RubenPari/music-release-artists.git
      branch: main
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: npm run migrate
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: "${MIGRATION_DATABASE_URL}"
      - key: DATABASE_SSL_CA
        scope: RUN_TIME
        type: SECRET
        value: "${DATABASE_SSL_CA}"
