name: music-release-artists

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging: *default-logging

  frontend:
    image: ${IMAGE_REGISTRY}/frontend:${IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  backend:
    image: ${IMAGE_REGISTRY}/backend:${IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - ${APP_ENV_FILE:-/etc/music-release-artists/app.env}
    environment:
      PORT: "4000"
      DATABASE_SSL_CA_PATH: /run/secrets/do-postgres-ca.crt
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
    expose:
      - "4000"
    volumes:
      - ${DATABASE_CA_FILE:-/etc/music-release-artists/ca-certificate.crt}:/run/secrets/do-postgres-ca.crt:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
