name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npx tsc --noEmit
          npm test

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: verify
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to App Platform
        uses: digitalocean/app_action/deploy@v2
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'false' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME || 'Uscite' }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.yaml
          print_build_logs: "true"
          print_deploy_logs: "true"

      - name: External readiness check
        env:
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
        run: |
          if [ -z "${PUBLIC_DOMAIN}" ]; then
            echo "PUBLIC_DOMAIN is not set; skipping readiness check"
            exit 0
          fi
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://${PUBLIC_DOMAIN}/api/health/ready"
